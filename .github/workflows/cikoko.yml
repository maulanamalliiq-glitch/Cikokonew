name: Cikoko - Pemeriksaan dan Build APK AAB

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build APK ARM64 dan AAB dengan keystore lama'
        type: boolean
        default: false
      version_name:
        description: 'Nama versi untuk build baru'
        type: string
        default: '2.6.13'
      version_code:
        description: 'Harus lebih tinggi dari version code tertinggi di Play Console'
        type: string
        default: '2613'

permissions:
  contents: read

concurrency:
  group: cikoko-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Periksa kode Flutter dan PHP
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql, mbstring
          coverage: none
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Validasi identitas aplikasi
        run: python3 scripts/check_identity.py
      - name: Pemeriksaan PHP dan regresi chat serta shift PJLP
        run: |
          set -euo pipefail
          find cpanel qa tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php qa/chat_runtime_2566_test.php
          php qa/chat_inbox_2563_test.php
          php qa/chat_hardcheck_2565_test.php
          php qa/pjlp_shift_recap_2558_test.php
          php qa/pppk_staff_2570_test.php
          php qa/hardcheck_routes_2571_test.php
          php qa/notification_flow_2572_test.php
          php qa/role_permissions_smoke.php
          php qa/app_update_policy_2606_test.php
          php qa/jumantik_mandiri_2607_test.php
          php qa/google_login_2608_test.php
          php qa/bank_sampah_2610_test.php
          php qa/bank_sampah_mockup_2613_test.php
          php qa/navbar_laporan_2611_test.php
          php qa/asn_permissions_test.php
          php qa/staff_ptsp_sosial_asn_test.php
          php qa/superadmin_access_2580_test.php
      - name: Siapkan Flutter dan uji
        working-directory: flutter
        run: |
          set -euo pipefail
          flutter create --platforms=android --project-name=cikoko .
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

  build:
    name: Build APK ARM64 dan AAB signed
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.build_release) || (github.event_name == 'push' && github.event.head_commit.message == 'ci: build Cikokonew release 2610'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CIKOKO_KEYSTORE_PATH: ${{ github.workspace }}/flutter/android/cikoko_upload.jks
      CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
      CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
      CIKOKO_KEY_ALIAS: androidkey
      EXPECTED_CERT: 394633E6A2F4C91C150D81B228908562D230D763031A0A0C205618B9D669D4E5
      RELEASE_NAME: ${{ inputs.version_name || '2.6.6' }}
      RELEASE_CODE: ${{ inputs.version_code || '2606' }}
    steps:
      - uses: actions/checkout@v4
      - name: Periksa ketersediaan signing secrets
        env:
          CIKOKO_KEYSTORE_B64: ${{ secrets.CIKOKO_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$CIKOKO_KEYSTORE_B64" || -z "$CIKOKO_STORE_PASSWORD" || -z "$CIKOKO_KEY_PASSWORD" ]]; then
            echo '::error::Tambahkan tiga signing secrets lama pada Settings > Secrets and variables > Actions di Cikokonew. Jangan membuat keystore baru.'
            exit 1
          fi
          umask 077
          printf '%s' "$CIKOKO_KEYSTORE_B64" | base64 --decode > "$CIKOKO_KEYSTORE_PATH"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verifikasi sertifikat lama
        run: |
          set -euo pipefail
          actual=$(keytool -list -v -keystore "$CIKOKO_KEYSTORE_PATH" -storepass:env CIKOKO_STORE_PASSWORD -alias "$CIKOKO_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          test "$actual" = "$EXPECTED_CERT" || { echo '::error::Keystore tidak cocok dengan sertifikat Cikoko lama'; exit 1; }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Atur versi build dan siapkan Android
        run: |
          set -euo pipefail
          python3 scripts/set_build_version.py
          cd flutter
          flutter create --platforms=android --project-name=cikoko .
          flutter pub get
          cd ..
          python3 scripts/check_identity.py
      - name: Build dan verifikasi AAB serta APK
        working-directory: flutter
        run: |
          set -euo pipefail
          flutter build appbundle --release
          mkdir -p "$GITHUB_WORKSPACE/dist"
          aab=build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify "$aab" > "$RUNNER_TEMP/aab-check.txt" 2>&1
          grep -q 'jar verified' "$RUNNER_TEMP/aab-check.txt"
          actual=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          test "$actual" = "$EXPECTED_CERT"
          cp "$aab" "$GITHUB_WORKSPACE/dist/CikokoSmart-v$RELEASE_NAME-$RELEASE_CODE-PLAY.aab"
          flutter build apk --release --split-per-abi --target-platform android-arm64
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          signed="$GITHUB_WORKSPACE/dist/CikokoSmart-v$RELEASE_NAME-$RELEASE_CODE-arm64.apk"
          "$apksigner" sign --ks "$CIKOKO_KEYSTORE_PATH" --ks-key-alias "$CIKOKO_KEY_ALIAS" --ks-pass env:CIKOKO_STORE_PASSWORD --key-pass env:CIKOKO_KEY_PASSWORD --out "$signed" "$apk"
          "$apksigner" verify --verbose --print-certs "$signed" > "$RUNNER_TEMP/apk-check.txt"
          actual=$(grep -iE 'certificate.*SHA.?256' "$RUNNER_TEMP/apk-check.txt" | grep -oiE '[0-9a-f]{64}|([0-9a-f]{2}:){31}[0-9a-f]{2}' | head -n1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test "$actual" = "$EXPECTED_CERT"
      - name: Simpan APK dan AAB
        uses: actions/upload-artifact@v4
        with:
          name: CikokoSmart-${{ inputs.version_code || '2606' }}-APK-AAB
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Hapus keystore sementara
        if: always()
        run: rm -f "$CIKOKO_KEYSTORE_PATH"

  apk-preview:
    name: Build APK ARM64 + AAB Bank Sampah UI 2613 (tanpa publikasi otomatis)
    needs: verify
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/bank-sampah-ui-mockup-2613' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CIKOKO_KEYSTORE_PATH: ${{ github.workspace }}/flutter/android/cikoko_upload.jks
      CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
      CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
      CIKOKO_KEY_ALIAS: androidkey
      EXPECTED_CERT: 394633E6A2F4C91C150D81B228908562D230D763031A0A0C205618B9D669D4E5
      RELEASE_NAME: 2.6.13
      RELEASE_CODE: '2613'
    steps:
      - uses: actions/checkout@v4
      - name: Periksa keystore lama untuk APK uji
        env:
          CIKOKO_KEYSTORE_B64: ${{ secrets.CIKOKO_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$CIKOKO_KEYSTORE_B64" || -z "$CIKOKO_STORE_PASSWORD" || -z "$CIKOKO_KEY_PASSWORD" ]]; then
            echo '::error::Signing secrets lama belum tersedia di GitHub Actions. Tidak membuat keystore baru.'
            exit 1
          fi
          umask 077
          mkdir -p "$(dirname "$CIKOKO_KEYSTORE_PATH")"
          printf '%s' "$CIKOKO_KEYSTORE_B64" | base64 --decode > "$CIKOKO_KEYSTORE_PATH"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verifikasi sertifikat lama
        run: |
          set -euo pipefail
          actual=$(keytool -list -v -keystore "$CIKOKO_KEYSTORE_PATH" -storepass:env CIKOKO_STORE_PASSWORD -alias "$CIKOKO_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          test "$actual" = "$EXPECTED_CERT" || { echo '::error::Sertifikat signing bukan keystore asli Cikoko'; exit 1; }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Validasi versi final aplikasi 2613
        run: |
          set -euo pipefail
          python3 scripts/set_build_version.py
          cd flutter
          flutter create --platforms=android --project-name=cikoko .
          flutter pub get
          cd ..
          python3 scripts/check_identity.py
      - name: Build dan verifikasi AAB Play Store signed
        working-directory: flutter
        run: |
          set -euo pipefail
          flutter build appbundle --release
          aab=build/app/outputs/bundle/release/app-release.aab
          test -s "$aab"
          jarsigner -verify "$aab" > "$RUNNER_TEMP/final-aab-check.txt" 2>&1
          grep -q 'jar verified' "$RUNNER_TEMP/final-aab-check.txt"
          actual=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          test "$actual" = "$EXPECTED_CERT" || { echo '::error::AAB tidak cocok dengan keystore lama Cikoko'; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$aab" "$GITHUB_WORKSPACE/dist/CikokoSmart-FINAL-v$RELEASE_NAME-$RELEASE_CODE-PLAY.aab"
      - name: Build dan verifikasi APK ARM64 signed
        working-directory: flutter
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi --target-platform android-arm64
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$apk"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          signed="$GITHUB_WORKSPACE/dist/CikokoSmart-FINAL-v$RELEASE_NAME-$RELEASE_CODE-arm64.apk"
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner" sign --ks "$CIKOKO_KEYSTORE_PATH" --ks-key-alias "$CIKOKO_KEY_ALIAS" --ks-pass env:CIKOKO_STORE_PASSWORD --key-pass env:CIKOKO_KEY_PASSWORD --out "$signed" "$apk"
          "$apksigner" verify --verbose --print-certs "$signed" > "$RUNNER_TEMP/pppk-apk-signature.txt"
          actual=$(grep -iE 'certificate.*SHA.?256' "$RUNNER_TEMP/pppk-apk-signature.txt" | grep -oiE '[0-9a-f]{64}|([0-9a-f]{2}:){31}[0-9a-f]{2}' | head -n1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test "$actual" = "$EXPECTED_CERT" || { echo '::error::APK tidak cocok dengan sertifikat lama'; exit 1; }
      - name: Upload APK FINAL dan AAB (tanpa rilis Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: CikokoSmart-FINAL-2613-APK-AAB
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Bersihkan keystore sementara
        if: always()
        run: rm -f "$CIKOKO_KEYSTORE_PATH"

  server-patch:
    name: Paket pembaruan cPanel tanpa konfigurasi privat
    needs: verify
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') ||
      (github.event_name == 'pull_request' && (github.head_ref == 'feat/google-login-2608' || github.head_ref == 'fix/google-profile-sync-2609' || github.head_ref == 'feat/bank-sampah-ui-mockup-2613') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan patch mobile-api dari Cikokonew
        run: |
          set -euo pipefail
          mkdir -p server-patch/mobile-api
          cp cpanel/roles-lib.php server-patch/roles-lib.php
          cp cpanel/mobile-api/permissions.php server-patch/mobile-api/
          cp cpanel/mobile-api/index.php server-patch/mobile-api/
          cp cpanel/mobile-api/app_update_policy_2606.php server-patch/mobile-api/
          cp cpanel/mobile-api/jumantik-2605.php server-patch/mobile-api/
          cp cpanel/mobile-api/jumantik_mandiri_2607.php server-patch/mobile-api/
          cp cpanel/mobile-api/google_auth_2608.php server-patch/mobile-api/
          cp cpanel/mobile-api/google_login_2608.php server-patch/mobile-api/
          cp cpanel/mobile-api/bank_sampah_2610.php server-patch/mobile-api/
          cp cpanel/mobile-api/notification_recipients.php server-patch/mobile-api/
          mkdir -p server-patch/templates
          cp cpanel/mobile-api/private/app_update_policy_2606.json server-patch/templates/app_update_policy_2606.example.json
          cp cpanel/mobile-api/chat_v2548.php server-patch/mobile-api/
          cp cpanel/mobile-api/chat_storage_2544.php server-patch/mobile-api/
          cp cpanel/mobile-api/chat_hardcheck_2565.php server-patch/mobile-api/
          cp cpanel/mobile-api/chat_runtime_2566.php server-patch/mobile-api/
          cp cpanel/mobile-api/chat_inbox_2563.php server-patch/mobile-api/
          cp cpanel/mobile-api/chat_offline_bot_2545.php server-patch/mobile-api/
          cp cpanel/mobile-api/integrated_services.php server-patch/mobile-api/
          cp cpanel/mobile-api/reviews.php server-patch/mobile-api/
          cp cpanel/mobile-api/boarding_houses.php server-patch/mobile-api/
          cp cpanel/mobile-api/pppk_staff.php server-patch/mobile-api/
          mkdir -p server-patch/sql
          cp cpanel/mobile-api/migrate_jumantik_2606.sql server-patch/sql/
          cp cpanel/mobile-api/migrate_jumantik_mandiri_2607.sql server-patch/sql/
          cp cpanel/mobile-api/migrate_google_login_2608.sql server-patch/sql/
          cp cpanel/mobile-api/migrate_bank_sampah_2610.sql server-patch/sql/
          cp cpanel/mobile-api/migrate_pppk_staff_2570.sql server-patch/sql/
          cp cpanel/mobile-api/migrate_reviews_2571.sql server-patch/sql/
          cp cpanel/mobile-api/migrate_chat_2544.sql server-patch/sql/
          cp cpanel/mobile-api/migrate_chat_extras_2571.sql server-patch/sql/
          cp cpanel/mobile-api/migrate_notifications_2572.sql server-patch/sql/
          cp cpanel/mobile-api/pppk_performance.php server-patch/mobile-api/
          cp cpanel/mobile-api/pjlp_attendance_2557.php server-patch/mobile-api/
          cp cpanel/mobile-api/pjlp_shifts_2558.php server-patch/mobile-api/
          cp cpanel/mobile-api/pjlp_leave.php server-patch/mobile-api/
          printf '%s\n' 'CikokoSmart 2610 mobile-api PATCH (terbatas)' 'UPDATE 2610: Do not overwrite private/app_update_policy_2606.json. Only the example in templates/ is included; live configuration remains untouched.' 'FIRST RELEASE: Keep force_update=false and minimum_supported_build=0. Set minimum to 2610 and force=true only after 2610 is fully available in Play Store to everyone.' 'The website and live API can differ from this repository. Backup and review index.php, roles-lib.php and data before uploading. Verify admin account creation and Jumantik admin moderation on staging.' '1. Backup public_html/mobile-api and its database first.' '2. Copy the CONTENTS of mobile-api/ into existing public_html/mobile-api/ (not the entire public_html).' '3. Do not erase private/, bootstrap.php, ahli-waris/config.php, database or uploaded files.' '4. Keep the production signing and admin credentials unchanged.' '5. Verify chat_v2548_status and authenticated chat_v2548_diagnostic before testing real chat.' '7. Import sql/migrate_pppk_staff_2570.sql after a database backup; never import schema.sql over production.' '8. Import sql/migrate_reviews_2571.sql, then confirm review_public returns HTTP 200 and ok=true.' '9. Check deployment_status returns api_release 2580. The chat status must respond 200 even without login.' '10. For missing chat tables import sql/migrate_chat_2544.sql then sql/migrate_chat_extras_2571.sql after backup. Never overwrite existing messages.' '11. After inspecting affected rows, optionally import sql/migrate_notifications_2572.sql to restore old PJLP leave alerts from private to personal scope.' '12. For PTSP and SOSIAL accounts, backup roles-lib.php and portal_users first. The updated roles-lib.php is required on public_html; update only after reviewing differences from the live site.' '13. Only Admin Utama may create PTSP/SOSIAL accounts. Do not insert account credentials directly into SQL.' '14. Super Admin website permission panel (deployed separately) uses mobile_role_permissions; no role SQL migration is required. Chat role grants require updated chat_offline_bot_2545.php.' '6. This patch does NOT repair an invalid database primary key automatically; if chat_id_auto_increment=false, inspect the existing schema and backup before migration.' > server-patch/README.txt
      - name: Unggah patch API terpisah dari APK
        uses: actions/upload-artifact@v4
        with:
          name: CikokoSmart-2612-MobileAPI-Patch
          path: server-patch/
          if-no-files-found: error
          retention-days: 30

      - name: Buat paket aman khusus Jumantik Mandiri Warga (tanpa file website lain)
        run: |
          set -euo pipefail
          mkdir -p jumantik-mandiri-safe/mobile-api jumantik-mandiri-safe/sql
          cp cpanel/mobile-api/jumantik_mandiri_2607.php jumantik-mandiri-safe/mobile-api/
          cp cpanel/mobile-api/notification_recipients.php jumantik-mandiri-safe/mobile-api/
          cp cpanel/mobile-api/migrate_jumantik_mandiri_2607.sql jumantik-mandiri-safe/sql/
          printf '%s\n' 'CIKOKO JUMANTIK MANDIRI 2607 - PATCH TERBATAS' '1. Backup mobile-api/notification_recipients.php, database dan private/ dulu.' '2. Impor SQL baru hanya setelah backup, atau pastikan API mempunyai izin CREATE.' '3. Upload file baru mobile-api/jumantik_mandiri_2607.php ke public_html/mobile-api/.' '4. Bandingkan notification_recipients.php dengan file live sebelum mengganti; jika live berbeda, gabungkan dua kategori publik: jumantik_mandiri_terbaru dan jumantik_rt_rw_terbaru.' '5. JANGAN hapus atau overwrite mobile-api/private, mobile-api/index.php, bootstrap.php, roles-lib.php dan laporan JSON lama.' '6. Uji akun warga, pengiriman form/foto, verifikasi Super Admin dan notifikasi personal dan publik.' '7. File APK/AAB tetap harus melalui Play Store. Aktifkan update wajib HANYA setelah versi target sepenuhnya tersedia.' > jumantik-mandiri-safe/README.txt
      - name: Unggah patch cPanel aman Jumantik Mandiri 2607
        uses: actions/upload-artifact@v4
        with:
          name: CikokoSmart-2608-JumantikMandiri-API-SAFE
          path: jumantik-mandiri-safe/
          if-no-files-found: error
          retention-days: 30

      - name: Siapkan patch Google Login 2608 yang aman (tanpa index.php)
        run: |
          set -euo pipefail
          mkdir -p google-login-safe/mobile-api google-login-safe/sql
          cp cpanel/mobile-api/google_auth_2608.php google-login-safe/mobile-api/
          cp cpanel/mobile-api/google_login_2608.php google-login-safe/mobile-api/
          cp cpanel/mobile-api/migrate_google_login_2608.sql google-login-safe/sql/
          printf '%s\n' 'CIKOKO GOOGLE LOGIN 2608 - PATCH TERBATAS' '1. Backup database dan folder mobile-api sebelum memasang.' '2. Import SQL baru mobile_google_accounts_2608 melalui phpMyAdmin; jangan hapus tabel lama.' '3. Upload dua file BARU ke public_html/mobile-api/: google_auth_2608.php dan google_login_2608.php.' '4. TIDAK perlu mengubah index.php, bootstrap.php, private/, portal_users, atau password lama.' '5. Google Sign-In harus diaktifkan pada konfigurasi proyek Firebase/Google Cloud, dan SHA-1 Play App Signing serta sertifikat upload harus cocok dengan OAuth Android.' '6. Uji login baru WARGA dan hubungkan akun lama lewat Profil setelah login username/password.' '7. Admin Utama tidak dapat ditautkan secara otomatis. Hak akun lain tidak berubah.' '8. Unggah AAB signed 2608 ke Play Console setelah lulus uji dan versionCode lebih tinggi dari rilis tertinggi.' '9. Aktifkan pembaruan wajib dari server hanya SETELAH rilis 2608 tersedia penuh bagi pengguna yang dituju.' > google-login-safe/README.txt
      - name: Unggah patch aman Google Login 2608
        uses: actions/upload-artifact@v4
        with:
          name: CikokoSmart-2608-GoogleLogin-API-SAFE
          path: google-login-safe/
          if-no-files-found: error
          retention-days: 30

      - name: Siapkan perbaikan profil Google saja (tanpa database atau API lain)
        run: |
          set -euo pipefail
          mkdir -p google-profile-2609/mobile-api
          cp cpanel/mobile-api/google_auth_2608.php google-profile-2609/mobile-api/
          printf '%s\n' 'CIKOKO GOOGLE PROFILE SYNC - PATCH PHP SATU FILE' '1. Khusus server dengan Login Google 2608 yang sudah berjalan.' '2. Backup public_html/mobile-api/google_auth_2608.php dan data/profil sebelum overwrite.' '3. Ekstrak isi paket di public_html/ agar mengganti mobile-api/google_auth_2608.php SAJA.' '4. Tidak ada SQL baru, tidak ada perubahan APK/AAB, index.php, password, role, RT/RW, atau laporan.' '5. Keluar dari aplikasi dan login ulang melalui Google untuk memicu penyalinan foto jika foto Cikoko masih kosong.' '6. Bila Google tidak memiliki klaim picture atau foto tidak dapat diunduh, login tetap berhasil dan foto lama tidak berubah.' '7. Nama/email hanya diisi jika kosong. Telepon, alamat, NIK, dan wilayah harus dilengkapi manual.' '8. Pastikan PHP curl/openssl aktif dan folder mobile-api/private dapat ditulis PHP.' > google-profile-2609/PANDUAN.txt
      - name: Unggah ZIP patch profil Google satu file
        uses: actions/upload-artifact@v4
        with:
          name: CikokoSmart-2608-GoogleProfil-FIX-SAFE
          path: google-profile-2609/
          if-no-files-found: error
          retention-days: 30

      - name: Buat paket Bank Sampah 2610 aman untuk cPanel (hanya file baru)
        run: |
          set -euo pipefail
          mkdir -p bank-sampah-2610-safe/mobile-api bank-sampah-2610-safe/sql
          cp cpanel/mobile-api/bank_sampah_2610.php bank-sampah-2610-safe/mobile-api/
          cp cpanel/mobile-api/migrate_bank_sampah_2610.sql bank-sampah-2610-safe/sql/
          printf '%s\n' 'BANK SAMPAH CIKOKO 2610 - PATCH AMAN, HANYA FILE BARU' '1. Backup database dan seluruh mobile-api terlebih dahulu.' '2. Impor hanya sql/migrate_bank_sampah_2610.sql ke database lama; tidak perlu menghapus tabel.' '3. Ekstrak ZIP di public_html: file baru mobile-api/bank_sampah_2610.php akan ditambahkan.' '4. Jangan mengganti index.php, bootstrap.php, private/, roles-lib.php, portal_users, atau database PJLP/PPPK.' '5. Hanya Admin Utama yang menambah/menghapus anggota (nonaktif daftar, bukan menghapus akun) dan menunjuk maksimal 5 petugas gabungan PJLP/PPPK.' '6. Admin membuat jadwal Minggu ke-2 dan ke-4 (2x per bulan), atau ubah jadwal menjadi 1x per 2 bulan.' '7. Petugas Bank Sampah PJLP/PPPK mengisi nama barang, Kg, Rp; menyimpan draft atau mengirim untuk pengesahan Admin. ASN dan Lurah baca penuh, PJLP/PPPK ringkasan di bawah foto Profil.' '8. Untuk menu native dibutuhkan APK/AAB build 2612 yang dipublikasikan melalui Play Store; server saja tidak dapat membuat halaman baru pada APK lama.' '9. Uji pada staging: role, daftar anggota, petugas, jadwal, 2.5 Kg, Rp, rekap 2026, notifikasi dan histori sebelum produksi.' '10. Jangan aktifkan update wajib sampai rilis baru tersedia di Play Store.' > bank-sampah-2610-safe/PETUNJUK-PASANG.txt
      - name: Unggah ZIP cPanel Bank Sampah aman 2610
        uses: actions/upload-artifact@v4
        with:
          name: CikokoSmart-2612-BankSampah-PPPK-API-SAFE
          path: bank-sampah-2610-safe/
          if-no-files-found: error
          retention-days: 30

  production-probe:
    name: Hardcheck endpoint publik server aktif (read-only)
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Verifikasi API, ulasan, dan chat tanpa kredensial
        run: |
          set -euo pipefail
          failed=0
          for target in \
            'deployment_status|https://datawebs.my.id/mobile-api/index.php?action=deployment_status' \
            'health|https://datawebs.my.id/mobile-api/index.php?action=health' \
            'review_public|https://datawebs.my.id/mobile-api/index.php?action=review_public' \
            'integrated_services_public|https://datawebs.my.id/mobile-api/index.php?action=integrated_services_public' \
            'boarding_public|https://datawebs.my.id/mobile-api/index.php?action=boarding_public' \
            'chat_v2548_status|https://datawebs.my.id/mobile-api/chat_v2548.php?action=chat_v2548_status'; do
            label="${target%%|*}"
            url="${target#*|}"
            status=$(curl -sSL --max-time 18 -o /tmp/cikoko-probe.json -w '%{http_code}' "$url")
            echo "$label HTTP $status"
            if [[ "$status" != 200 ]]; then
              echo "::warning::$label belum tersedia pada server publik (HTTP $status)"
              failed=1
              continue
            fi
            if [[ "$label" == deployment_status ]]; then
              python3 -c "import json; d=json.load(open('/tmp/cikoko-probe.json')); assert d.get('api_release') == '2580'" || {
                echo "::warning::Server cPanel belum menggunakan kode rilis 2580"
                failed=1
                continue
              }
            fi
            python3 -c "import json; d=json.load(open('/tmp/cikoko-probe.json')); assert d.get('ok') is True" || {
              echo "::warning::$label tidak mengembalikan ok=true dari server"
              failed=1
              continue
            }
          done
          exit "$failed"

  signing-readiness:
    name: Periksa signing secrets tanpa membuka nilainya
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Periksa keystore, alias, sertifikat, dan password
        env:
          CIKOKO_KEYSTORE_B64: ${{ secrets.CIKOKO_KEYSTORE_B64 }}
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
        shell: python
        run: |
          import base64, os, pathlib, re, subprocess, tempfile
          names = ['CIKOKO_KEYSTORE_B64', 'CIKOKO_STORE_PASSWORD', 'CIKOKO_KEY_PASSWORD']
          def report(message):
              print(message, flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(message + '\n\n')
          missing = [name for name in names if not os.environ.get(name)]
          for name in names:
              report(name + ': ' + ('MISSING' if name in missing else 'PRESENT'))
          if missing:
              report('SIGNING_NOT_READY: required repository secrets are missing.')
              raise SystemExit(0)
          with tempfile.TemporaryDirectory() as temp:
              key = pathlib.Path(temp) / 'upload.jks'
              try:
                  raw = base64.b64decode(''.join(os.environ[names[0]].split()), validate=True)
              except Exception:
                  report('SIGNING_INVALID: keystore secret is not valid Base64.')
                  raise SystemExit(1)
              key.write_bytes(raw)
              key.chmod(0o600)
              common = ['keytool', '-J-Duser.language=en', '-J-Duser.country=US']
              check = subprocess.run(common + ['-list', '-v', '-keystore', str(key),
                  '-storepass:env', names[1], '-alias', 'androidkey'], capture_output=True, text=True)
              if check.returncode:
                  report('SIGNING_INVALID: keystore, store password, or androidkey alias could not be verified.')
                  raise SystemExit(1)
              match = re.search(r'SHA256:\s*([0-9A-Fa-f:]+)', check.stdout)
              expected = '394633E6A2F4C91C150D81B228908562D230D763031A0A0C205618B9D669D4E5'
              if not match or match[1].replace(':','').upper() != expected:
                  report('SIGNING_INVALID: certificate does not match the existing Cikoko upload certificate.')
                  raise SystemExit(1)
              report('CERTIFICATE_MATCH: existing Cikoko upload certificate verified.')
              check = subprocess.run(common + ['-certreq', '-alias', 'androidkey',
                  '-keystore', str(key), '-storepass:env', names[1], '-keypass:env', names[2],
                  '-file', str(pathlib.Path(temp) / 'verification.csr')], capture_output=True, text=True)
              if check.returncode:
                  report('SIGNING_INVALID: private key password or signing operation failed.')
                  raise SystemExit(1)
              report('SIGNING_READY: keystore, alias, certificate and both passwords verified. No APK/AAB built.')
